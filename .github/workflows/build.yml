name: Build All Platforms

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one Pages deployment at a time; do not cancel in-flight deploys
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 0. Run Unit Tests ─────────────────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false

  # ── 1. Build Web ────────────────────────────────────────────────────────────
  build-web:
    name: Build Web
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version")
          echo "name=${BASE}-build.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Build Angular app for GitHub Pages
        run: npm run build -- --base-href /Dont-Fret/

      - name: Verify GitHub Pages build output
        run: |
          test -f dist/dont-fret/browser/index.html
          test -f dist/dont-fret/browser/manifest.webmanifest
          grep -q '<base href="/Dont-Fret/">' dist/dont-fret/browser/index.html

      # Upload for GitHub Pages deployment (deploy-web job below)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/dont-fret/browser

  # ── 2. Deploy Web → GitHub Pages (push to master only) ─────────────────────
  deploy-web:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── 3. Build Android APKs (debug unlocked + release unsigned locked) ───────
  build-android:
    name: Build Android APKs
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version")
          echo "name=${BASE}-build.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "code=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build Angular app for Android debug (dev unlocked)
        run: npm run build -- --configuration debug-unlocked

      - name: Inject version into build.gradle
        run: |
          sed -i "s/versionCode .*/versionCode ${{ steps.version.outputs.code }}/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"${{ steps.version.outputs.name }}\"/" android/app/build.gradle

      - name: Sync Capacitor (Android debug)
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Rename debug APK with version
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/dont-fret-debug-unlocked-${{ steps.version.outputs.name }}.apk

      - name: Build Angular app for Android release (locked)
        run: npm run build -- --configuration production

      - name: Sync Capacitor (Android release)
        run: npx cap sync android

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease
        working-directory: android

      - name: Rename unsigned release APK with version
        run: |
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk \
             android/app/build/outputs/apk/release/dont-fret-release-unsigned-${{ steps.version.outputs.name }}.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dont-fret-debug-unlocked-${{ steps.version.outputs.name }}
          path: android/app/build/outputs/apk/debug/dont-fret-debug-unlocked-${{ steps.version.outputs.name }}.apk
          retention-days: 30

      - name: Upload unsigned release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dont-fret-release-unsigned-${{ steps.version.outputs.name }}
          path: android/app/build/outputs/apk/release/dont-fret-release-unsigned-${{ steps.version.outputs.name }}.apk
          retention-days: 30
