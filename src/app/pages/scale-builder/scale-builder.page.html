<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Scale Builder</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div style="padding:12px 16px 0;" class="activity-shell">
    <app-game-hud
      kicker="Scale Forge"
      title="Build each major scale in order"
      [chip]="sessionCorrect + ' clears'"
      icon="🧱"
      [compact]="true"
      theme="timed"
      style="margin-bottom:10px; display:block;">
    </app-game-hud>
  </div>

  <div style="padding:16px;" class="fade-in-up">
    <!-- Key selector chips -->
    <div style="overflow-x:auto; display:flex; gap:6px; padding-bottom:12px; -webkit-overflow-scrolling:touch; scrollbar-width:none;">
      <button *ngFor="let k of stageKeys"
              (click)="selectKey(k)"
              class="df-btn"
              [class]="currentKey === k ? 'df-btn-primary' : 'df-btn-ghost'"
              style="flex-shrink:0; padding:4px 12px; font-size:0.8rem; min-height:unset; font-weight:700;">
        {{ k }}
      </button>
    </div>

    <div class="mode-runtime-shell" style="margin-bottom:12px;">
      <div class="mode-fx-layer" [class.warning]="fxLayerClass === 'warning'" [class.danger]="fxLayerClass === 'danger'" [class.fever]="fxLayerClass === 'fever'"></div>
      <div class="runtime-metrics">
        <span class="runtime-chip" [class.hot]="currentStreak >= 3">Streak x{{ currentStreak }}</span>
        <app-combo-meter [combo]="currentStreak" label="Combo"></app-combo-meter>
        <span class="runtime-chip" [class.hot]="pressureChipClass === 'hot'" [class.danger]="pressureChipClass === 'danger'">{{ pressureLabel }}</span>
      </div>

      <!-- Challenge Card -->
      <div class="question-card runtime-card" [class.question-enter-a]="questionFlip" [class.question-enter-b]="!questionFlip">
        <div class="question-key">Build the Scale</div>
        <div class="question-text" style="font-size:2rem; font-weight:900; letter-spacing:-0.04em; color:var(--df-accent);">
          {{ currentKey }} Major
        </div>
        <div class="question-meta">Select the 7 notes in order</div>
      </div>
    </div>

    <!-- Progress bar -->
    <div class="progress-bar-track" style="margin-bottom:12px;">
      <div class="progress-bar-fill" [style.width.%]="progress$"></div>
    </div>

    <!-- Built so far -->
    <div style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; justify-content:center; min-height:44px;">
      <span *ngFor="let note of builtScale; let i = index"
            style="background:rgba(74,222,128,0.15); border:1px solid var(--df-green); color:var(--df-green); font-weight:700; font-size:1rem; padding:6px 12px; border-radius:8px;">
        {{ note }}
      </span>
      <span *ngFor="let _ of [].constructor(7 - builtScale.length)"
            style="background:var(--df-surface2); border:1px dashed var(--df-border); color:var(--df-text2); font-size:1rem; padding:6px 14px; border-radius:8px;">
        ?
      </span>
    </div>

    <!-- Complete state -->
    <div *ngIf="state === 'complete'" class="feedback-banner correct" style="margin-bottom:16px;">
      🎉 Perfect! {{ currentKey }} Major Scale complete!
    </div>

    <!-- Note grid -->
    <div class="note-grid" [style.opacity]="state === 'complete' ? '0.4' : '1'">
      <button *ngFor="let note of notes"
              class="note-btn"
              [class]="getNoteState(note)"
              (click)="selectNote(note)"
              [disabled]="state === 'complete'">
        {{ note }}
      </button>
    </div>

    <!-- Incorrect flash -->
    <div *ngIf="lastFeedback === 'incorrect' && state === 'building'" class="feedback-banner incorrect" style="margin-top:12px;">
      ❌ Wrong note — try again
    </div>

    <!-- Next button -->
    <button *ngIf="state === 'complete'" class="df-btn df-btn-primary" style="width:100%; margin-top:16px;" (click)="newChallenge()">
      Next Key →
    </button>
  </div>

  <div style="height:80px;"></div>
</ion-content>
